# ============================================================================
# TAXONOMIA BASE v1.0 — temas transversais a qualquer categoria/estudo
# Usada por scripts/classify_corpus.py. Multi-idioma: pt/es/it/fr/en juntos
# (o matching é por palavra, com acentos normalizados; um tema dispara se
# qualquer termo aparecer como palavra inteira).
# Léxico específico do estudo (temas do setor) vai em config/lexico_<estudo>.yaml
# com a MESMA estrutura — os dois são mesclados na classificação.
# Mudou a taxonomia? Suba a versão e registre no PROTOCOLO.md (o hash sai no
# relatório de classificação).
# ============================================================================
